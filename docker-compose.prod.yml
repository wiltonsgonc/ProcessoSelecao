# ==============================================
# PRODUÇÃO - Docker Compose para Ubuntu + Docker
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ==============================================

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: ProcessoSelecao.Api/Dockerfile.prod
    env_file:
      - .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - documentos_data:/app/documentos:Z
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped

volumes:
  documentos_data:
    driver: local
    name: processo_selecao_documentos
