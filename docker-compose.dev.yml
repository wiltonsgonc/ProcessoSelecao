# ==============================================
# DESENVOLVIMENTO - Override para hot-reload
# Uso: compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d
# ==============================================

services:
  sqlserver:
    # Em dev, a porta ja esta exposta no base. Mantido aqui por clareza.
    ports:
      - "1433:1433"

  backend:
    build:
      context: ./src/backend
      dockerfile: ProcessoSelecao.Api/Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./src/backend:/src:Z
      - backend_cache:/src/.dotnet
      - ./documentos:/app/documentos:Z

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: development
    environment:
      NG_HMR: "1"
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./src/frontend:/app:Z
      - /app/node_modules
    # CORRECAO: porta explicitamente mapeada no dev para hot-reload
    ports:
      - "4200:80"
    command:
      - "sh"
      - "-c"
      - |
        if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
          echo '>>> Instalando dependencias...'
          npm install
        fi
        npm run start -- --host 0.0.0.0 --port 80 --poll 2000 --disable-host-check
