# ==============================================
# Base - Docker Compose para ProcessoSelecao
# Modo padrao: DESENVOLVIMENTO (hot-reload)
#
# Iniciar (desenvolvimento):
#   docker compose -f docker-compose.yml --env-file .env.dev up -d --build
#
# Iniciar (producao - sobrepoe build e configs):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Scripts:
#   ./scripts/build-full.sh          (producao)
#   ./scripts/build-full.sh --dev    (desenvolvimento)
# ==============================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: processo-selecao-sqlserver
    user: root
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      MSSQL_AGENT_ENABLED: "false"
      DB_NAME: ${DB_NAME:-ProcessoSelecaoDb}
      DB_EXTERNAL_USER: ${DB_EXTERNAL_USER:-db_user}
      DB_EXTERNAL_PASSWORD: ${DB_EXTERNAL_PASSWORD}
    ports:
      - "14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
      - sqlserver_log:/var/opt/mssql/log
      - sqlserver_backup:/var/opt/mssql/backup
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 15s
      retries: 30
      start_period: 120s
      timeout: 15s
    command:
      - "bash"
      - "-c"
      - |
        /opt/mssql/bin/sqlservr &
        SQLSERVER_PID=$$!
        echo 'Aguardando SQL Server iniciar...'
        for i in $$(seq 1 90); do
          if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q 'SELECT 1' > /dev/null 2>&1; then
            echo "SQL Server pronto apos $${i} tentativas"
            break
          fi
          echo "Tentativa $${i}/90 - aguardando 5s..."
          sleep 5
        done
        echo 'Executando init.sql...'
        /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -d master \
          -v DB_EXTERNAL_USER="$${DB_EXTERNAL_USER:-db_user}" \
          -v DB_EXTERNAL_PASSWORD="$${DB_EXTERNAL_PASSWORD}" \
          -v DB_NAME="$${DB_NAME:-ProcessoSelecaoDb}" \
          -i /docker-entrypoint-initdb.d/init.sql && echo 'init.sql executado com sucesso'
        wait $$SQLSERVER_PID
    restart: unless-stopped
    networks:
      - processo-selecao-network

  backend:
    build:
      context: ./src/backend
      dockerfile: ProcessoSelecao.Api/Dockerfile
    container_name: processo-selecao-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=${DB_HOST};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;
      JwtSettings__SecretKey: ${JWT_SECRETKEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      EmailSettings__SmtpHost: ${SMTP_HOST}
      EmailSettings__SmtpPort: ${SMTP_PORT}
      EmailSettings__SmtpUser: ${SMTP_USER}
      EmailSettings__SmtpPassword: ${SMTP_PASSWORD}
      EmailSettings__FromEmail: ${FROM_EMAIL}
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 180s
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./src/backend:/src:Z
      - backend_cache:/src/.dotnet
      - ./documentos:/app/documentos:Z
    restart: unless-stopped
    networks:
      - processo-selecao-network

  frontend:
    build:
      context: ./src/frontend/ProcessoSelecao.Blazor
      dockerfile: Dockerfile
    container_name: processo-selecao-frontend
    environment:
      - Backend__BaseUrl=http://backend:5002/api
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "4200:80"
    volumes:
      - ./src/frontend/ProcessoSelecao.Blazor:/app:Z
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - processo-selecao-network

networks:
  processo-selecao-network:
    driver: bridge

volumes:
  sqlserver_data:
  sqlserver_log:
  sqlserver_backup:
  documentos_data:
  backend_cache:
