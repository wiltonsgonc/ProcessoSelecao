services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: processo-selecao-sqlserver
    env_file:
      - .env
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
      - sqlserver_log:/var/opt/mssql/log
      - sqlserver_backup:/var/opt/mssql/backup
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s
    command: |
      bash -c "
      /opt/mssql/bin/sqlservr &
      for i in {1..30}; do
        if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -C -Q 'SELECT 1' > /dev/null 2>&1; then
          echo 'SQL Server is ready'
          break
        fi
        echo 'Waiting for SQL Server...'
        sleep 2
      done
      echo 'Running init.sql...'
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -C -d master \
        -v DB_EXTERNAL_USER='${DB_EXTERNAL_USER}' \
        -v DB_EXTERNAL_PASSWORD='${DB_EXTERNAL_PASSWORD}' \
        -v DB_NAME='${DB_NAME}' \
        -i /docker-entrypoint-initdb.d/init.sql
      wait"
    restart: unless-stopped
    networks:
      - processo-selecao-network

  backend:
    build:
      context: ./src/backend
      dockerfile: ProcessoSelecao.Api/Dockerfile
    container_name: processo-selecao-backend
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:5002
      ConnectionStrings__DefaultConnection: Server=${DB_HOST};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;
      JwtSettings__SecretKey: ${JWT_SECRETKEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      EmailSettings__SmtpHost: ${SMTP_HOST}
      EmailSettings__SmtpPort: ${SMTP_PORT}
      EmailSettings__SmtpUser: ${SMTP_USER}
      EmailSettings__SmtpPassword: ${SMTP_PASSWORD}
      EmailSettings__FromEmail: ${FROM_EMAIL}
    ports:
      - "5002:5002"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./documentos:/app/documentos
    restart: unless-stopped
    networks:
      - processo-selecao-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: production
    container_name: processo-selecao-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - processo-selecao-network

networks:
  processo-selecao-network:
    driver: bridge

volumes:
  sqlserver_data:
  sqlserver_log:
  sqlserver_backup:
  documentos_data:
  backend_cache:
